body:
  - type: markdown
    attributes:
      value: |
        Ideas are for new packages and early or cross-package proposals. If you have a specific feature in mind for one package, open a feature request in its repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why do the current options fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work? A short usage example helps.
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Where it fits
      description: An existing package, several packages, or a new one.
      placeholder: New package for Laravel
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Native features, existing packages, or application code you looked at.
